name: Forge build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        run: bash ./gradlew --no-daemon build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: isoforge-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: warn
